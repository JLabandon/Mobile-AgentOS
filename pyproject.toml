[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ipc-mvp"
version = "0.1.0"
description = "Minimal MobileSteward-style centralized controller for Android app agents."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ipc_mvp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
