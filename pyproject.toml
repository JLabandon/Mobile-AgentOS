[project]
name = "mobile-agent-os"
version = "0.1.0"
description = "Mobile AgentOS runtime prototype for app-oriented mobile agents"
requires-python = ">=3.13,<3.14"
dependencies = [
    "async_adbutils",
    "google-genai==2.18.1",
    "openai>=1.0.0",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
